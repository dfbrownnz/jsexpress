steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/jsexpress:$_IMAGE_TAG', '.']

  # Push the Docker image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/jsexpress:$COMMIT_SHA']

images:
  # - 'gcr.io/$PROJECT_ID/jsexpress:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/jsexpress:latest'

options:
  logging: CLOUD_LOGGING_ONLY

# Define a fallback default value here
substitutions:
  _IMAGE_TAG: 'latest'
